name: Blueprint Power
description: 'Blueprint Power was a New York City software company, founded in 2017 by Robyn Beavers,
  that turned commercial real estate portfolios into virtual power plants. Its cloud platform connected
  to distributed energy assets in buildings — solar, batteries, cogeneration — and used data-driven and
  machine-learning models to aggregate, orchestrate and transact that surplus capacity into wholesale
  energy markets. It raised a $3.5M Series A (Congruent Ventures, MetaProp, Fifth Wall, Fred Wilson,
  Brad Burnham) and was acquired by bp in October 2021, joining the bp Launchpad portfolio. As of this
  enrichment pass the company operates no independent public surface: www.blueprintpower.com returns a
  301 permanent redirect to bp.com/retailenergy, and no developer portal, API documentation, OpenAPI,
  SDK, or public GitHub organization could be found. Retained in the network as an acquired-company
  record with no API surface.'
